name: Publish release on tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK (Temurin 21)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: false

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Generate Fabric mappings (workaround)
        run: ./gradlew generateFabric1211MappingsArtifact

      - name: Publish GitHub Maven artifacts
        run: ./gradlew publish --no-configuration-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG_LATEST.md
          files: |
            **/build/libs/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
